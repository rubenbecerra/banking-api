spring.application.name=banking
server.port=8081

# Carga el fichero .env (ignorado por git) al arrancar en local.
# En Docker/CI las variables llegan por el entorno del contenedor.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/accounts}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Defaults seguros: sin SQL, sin stacktraces ni mensajes internos en errores.
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never
spring.web.error.include-binding-errors=never

# Actuator mínimo; el perfil dev amplía endpoints y detalles de health.
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.env=production

jwt.secret=${JWT_SECRET}

# Cookies: pon COOKIE_SECURE=true en producción (HTTPS). En local HTTP debe ser false.
app.security.cookie-secure=${COOKIE_SECURE:false}

# Purga diaria de claves de idempotencia caducadas (03:00, hora del servidor).
idempotency.purge.cron=0 0 3 * * *
