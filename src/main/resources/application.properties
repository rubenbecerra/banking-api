spring.application.name=banking
server.port=8081

# Carga el fichero .env (ignorado por git) al arrancar en local.
# En Docker/CI las variables llegan por el entorno del contenedor.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/accounts}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.web.error.include-stacktrace=always
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.env=production

jwt.secret=${JWT_SECRET}
